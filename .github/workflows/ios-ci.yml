name: iOS CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme TypedNetwork \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            | xcpretty
